services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sams
      POSTGRES_PASSWORD: sams
      POSTGRES_DB: sams
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sams"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://sams:sams@db:5432/sams
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in your environment}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
