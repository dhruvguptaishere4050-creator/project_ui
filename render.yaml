services:
  - type: web
    name: sams
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: sams-db
          property: connectionString

databases:
  - name: sams-db
    databaseName: sams
    user: sams
